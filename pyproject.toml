[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "version-aware-retriever"
version = "0.1.0"
description = "Version-aware technical retrieval research and evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
reranker = [
    "transformers>=4.48,<4.50",
    "torch>=2.5,<2.7",
    "huggingface-hub>=0.28,<1",
]
dense = [
    "sentence-transformers>=3.4,<4",
    "transformers>=4.48,<4.50",
    "torch>=2.5,<2.7",
    "huggingface-hub>=0.28,<1",
]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["data/pydantic/frozen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
