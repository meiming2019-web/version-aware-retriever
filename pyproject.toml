[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "version-aware-retriever"
version = "0.1.1"
description = "Evidence-grounded Pydantic migration answers with frozen hybrid retrieval."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/meiming2019-web/version-aware-retriever"
Documentation = "https://github.com/meiming2019-web/version-aware-retriever#readme"
Issues = "https://github.com/meiming2019-web/version-aware-retriever/issues"

[project.scripts]
version-aware-retriever = "version_aware_retriever.grounded_answer:main"

[project.optional-dependencies]
reranker = [
    "transformers>=4.48,<4.50",
    "torch>=2.5,<2.7",
    "huggingface-hub>=0.28,<1",
]
dense = [
    "sentence-transformers>=3.4,<4",
    "transformers>=4.48,<4.50",
    "torch>=2.5,<2.7",
    "huggingface-hub>=0.28,<1",
]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
version_aware_retriever = ["runtime/*.json", "runtime/*-LICENSE", "runtime/NOTICE.md"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["data/pydantic/frozen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
