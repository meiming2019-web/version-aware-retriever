name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Strict typing
        run: python -m mypy --strict
      - name: Verify frozen sources offline
        run: python -m version_aware_retriever.acquisition verify
      - name: Verify extraction without rebuilding
        run: python -m version_aware_retriever.extraction verify

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          from pathlib import Path
          artifacts = list(Path("dist").iterdir())
          assert len(artifacts) == 2, artifacts
          assert len(list(Path("dist").glob("*.whl"))) == 1
          assert len(list(Path("dist").glob("*.tar.gz"))) == 1
          PY
      - name: Clean installed-wheel smoke (no models or credentials)
        run: |
          package_smoke_dir=$(mktemp -d)
          python -m venv "$package_smoke_dir/venv"
          "$package_smoke_dir/venv/bin/python" -m pip install --no-deps dist/*.whl
          cp scripts/check_installed.py "$package_smoke_dir/check_installed.py"
          cd "$package_smoke_dir"
          unset PYTHONPATH
          "$package_smoke_dir/venv/bin/python" -I -c 'import version_aware_retriever'
          "$package_smoke_dir/venv/bin/version-aware-retriever" --help
          "$package_smoke_dir/venv/bin/python" -I -m version_aware_retriever.grounded_answer --help
          "$package_smoke_dir/venv/bin/python" -I check_installed.py --forbid-root "$GITHUB_WORKSPACE"
